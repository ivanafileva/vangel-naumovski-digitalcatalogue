# Vangel Naumovski — WordPress site for RepoRun.
# WordPress (with the theme baked into the image) + MariaDB.
# Secrets come from the stack's Environment values in RepoRun, never from this file.
services:
  wordpress:
    build: ./wordpress
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-48 Art Works}
      # behind RepoRun's HTTPS proxy: trust the forwarded scheme and serve
      # WordPress on whatever address the endpoint gets ($$ = literal $)
      WORDPRESS_CONFIG_EXTRA: |
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        if (!empty($$_SERVER['HTTP_HOST'])) {
          define('WP_HOME', ((!empty($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] !== 'off') ? 'https' : 'http') . '://' . $$_SERVER['HTTP_HOST']);
          define('WP_SITEURL', WP_HOME);
        }
    volumes:
      - ./.stack-data/uploads:/var/www/html/wp-content/uploads
    cpus: 0.25
    mem_limit: 256m

  db:
    image: mariadb:11.4
    # small memory footprint so the stack fits the team quota
    command: --innodb-buffer-pool-size=64M --performance-schema=OFF --max-connections=40
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./.stack-data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    cpus: 0.25
    mem_limit: 256m
